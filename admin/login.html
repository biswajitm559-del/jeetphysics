<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Admin Login | JeetPhysics</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Base Styles -->
  <link rel="stylesheet" href="../style.css" />

  <!-- Import Map for Supabase in Browser -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
  </script>

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .auth-card {
      background: rgba(8, 20, 50, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      transition: var(--transition);
    }

    .auth-card:hover {
      border-color: var(--border-glow);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .auth-logo-icon {
      font-size: 2rem;
    }

    .auth-logo-text {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .auth-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 999px;
      color: var(--blue-300);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 6px;
    }

    .auth-title {
      font-family: var(--font-head);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 14px;
    }

    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(5, 18, 41, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      border: 1px solid rgba(82, 160, 255, 0.3);
      border-radius: var(--radius-sm);
      color: #ffffff;
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      margin-top: 24px;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
      box-shadow: var(--shadow-glow);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      line-height: 1.45;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6ee7b7;
    }

    .alert-warning {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(82, 160, 255, 0.1);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--blue-300);
      text-decoration: none;
      transition: var(--transition);
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Starfield Canvas (Subtle Background) -->
  <canvas id="starfield"></canvas>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <span class="auth-logo-icon">⚛️</span>
          <span class="auth-logo-text"><span class="brand-jeet">Jeet</span><span class="brand-physics">Physics</span></span>
        </a>
        <div>
          <span class="auth-badge">Faculty Portal</span>
        </div>
        <h1 class="auth-title">Administrator Sign In</h1>
        <p class="auth-subtitle">Restricted to authorized departmental administrators</p>
      </div>

      <!-- Alert Banners -->
      <div id="alertBanner" class="alert alert-error" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Administrator Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="faculty@college.edu.in"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span id="btnText">Sign In to Academic CMS</span>
          <div id="btnSpinner" class="spinner"></div>
        </button>
      </form>

      <div class="auth-footer">
        <a href="../index.html">← Return to JeetPhysics Homepage</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, AcademicService } from '../lib/supabaseClient.js';
    import { AdminAuthGuard } from './auth-guard.js';

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBanner = document.getElementById('alertBanner');

    // Parse URL search params for redirects or error flags
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/admin/academic/';
    const errorParam = urlParams.get('error');

    if (errorParam === 'unauthorized') {
      showAlert('Access Denied: Your account is not registered as an active administrator.', 'error');
    } else if (errorParam === 'revoked') {
      showAlert('Session terminated: Administrator privileges have been updated.', 'warning');
    }

    function showAlert(message, type = 'error') {
      alertBanner.textContent = message;
      alertBanner.className = `alert alert-${type}`;
      alertBanner.style.display = 'block';
    }

    function hideAlert() {
      alertBanner.style.display = 'none';
      alertBanner.textContent = '';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Verifying credentials...';
      } else {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Sign In to Academic CMS';
      }
    }

    // Check if an active admin session already exists
    async function checkExistingSession() {
      const { isAuth, isAdmin, user } = await AdminAuthGuard.checkSession();
      if (isAuth && isAdmin) {
        window.location.replace(redirectUrl);
      } else if (isAuth && !isAdmin) {
        showAlert(`Signed in as ${user.email}, but this account does not have administrator privileges.`, 'warning');
      }
    }

    checkExistingSession();

    // Handle Form Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Please enter both email and password.');
        return;
      }

      setLoading(true);

      try {
        // 1. Authenticate with Supabase Auth
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (authError) {
          throw new Error(authError.message || 'Invalid email or password.');
        }

        // 2. Verify authorization in public.admin_users table
        const { isAuth, isAdmin, user } = await AdminAuthGuard.checkSession();

        if (!isAuth || !isAdmin) {
          // User authenticated, but NOT in public.admin_users
          console.warn('[AdminLogin] Authenticated non-admin detected. Signing out...');
          await supabase.auth.signOut();
          showAlert(
            `Access Denied: Account "${email}" is not registered as an active administrator. Contact the portal owner.`,
            'error'
          );
          setLoading(false);
          return;
        }

        // 3. Authorized active administrator
        showAlert('Authentication verified. Redirecting to academic portal...', 'success');
        setTimeout(() => {
          window.location.replace(redirectUrl);
        }, 500);

      } catch (err) {
        console.error('[AdminLogin] Authentication failure:', err.message);
        showAlert(err.message || 'Failed to sign in. Please verify your credentials.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
